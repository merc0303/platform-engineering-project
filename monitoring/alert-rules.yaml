apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: {name: shop-alerts, namespace: monitoring, labels: {release: kube-prometheus-stack}}
spec:
  groups:
    - name: shop
      rules:
        - alert: ServiceDown
          expr: sum by (service) (up{namespace="shop"}) == 0
          for: 1m
          labels: {severity: critical}
          annotations: {summary: "{{ $labels.service }} has no healthy pods"}
        - alert: PodMemoryNearLimit
          expr: |
            max by (pod) (container_memory_working_set_bytes{namespace="shop",container="app"})
            / max by (pod) (kube_pod_container_resource_limits{namespace="shop",resource="memory"}) > 0.85
          for: 2m
          labels: {severity: warning}
          annotations: {summary: "{{ $labels.pod }} is above 85% of its memory limit"}
        - alert: HighLatencyP95
          expr: histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
          for: 5m
          labels: {severity: warning}
          annotations: {summary: "p95 latency above 500ms for {{ $labels.service }}"}
