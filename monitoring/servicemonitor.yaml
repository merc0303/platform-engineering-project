apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: shop-services, namespace: monitoring, labels: {release: kube-prometheus-stack}}
spec:
  namespaceSelector: {matchNames: [shop]}
  selector: {matchExpressions: [{key: app, operator: Exists}]}
  endpoints: [{port: http, path: /metrics, interval: 15s}]
