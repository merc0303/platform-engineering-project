apiVersion: v1
kind: ServiceAccount
metadata: {name: users-service, namespace: shop}
automountServiceAccountToken: false
---
# RBAC: least privilege - the service may only read its own ConfigMap
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: users-service, namespace: shop}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [users-service]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: users-service, namespace: shop}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: users-service}
subjects: [{kind: ServiceAccount, name: users-service, namespace: shop}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: users-service, namespace: shop}
data:
  SERVICE_NAME: users-service
  APP_VERSION: "1.0.0"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: users-service, namespace: shop, labels: {app: users-service}}
spec:
  replicas: 2
  selector: {matchLabels: {app: users-service}}
  template:
    metadata: {labels: {app: users-service}}
    spec:
      serviceAccountName: users-service
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: app
          image: ghcr.io/merc0303/users-service:latest
          ports: [{containerPort: 8080, name: http}]
          envFrom: [{configMapRef: {name: users-service}}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: users-service, namespace: shop, labels: {app: users-service}}
spec:
  selector: {app: users-service}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: users-service, namespace: shop}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: users-service}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
---
# Network segmentation: allow traffic only from the shop namespace and ingress/monitoring
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-users-service, namespace: shop}
spec:
  podSelector: {matchLabels: {app: users-service}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector: {matchExpressions: [{key: kubernetes.io/metadata.name, operator: In, values: [monitoring, ingress-nginx]}]}
      ports: [{port: 8080}]
