apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: shop, namespace: shop}
spec:
  rules:
    - http:
        paths:
          - {path: /users, pathType: Prefix, backend: {service: {name: users-service, port: {number: 80}}}}
          - {path: /orders, pathType: Prefix, backend: {service: {name: orders-service, port: {number: 80}}}}
          - {path: /inventory, pathType: Prefix, backend: {service: {name: inventory-service, port: {number: 80}}}}
